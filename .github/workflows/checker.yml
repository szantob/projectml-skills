name: checker

on:
  push:
  pull_request:

# This workflow reads the repository and runs tests. It writes nothing back,
# so it is given no scope to.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r checker/requirements-dev.txt
      - run: python -m ruff check checker
      - run: python -m pytest checker/tests
